name: ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Source health
        run: npm run sources-check
      - name: Ingest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run ingest
      - name: Regression gate
        run: npm run classify-check
      - name: Publish snapshot to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run publish
