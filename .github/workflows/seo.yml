name: seo

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/app/**"
      - "src/middleware.ts"
      - "src/lib/seo.ts"
      - "src/lib/store.ts"
      - "scripts/seo-audit.ts"
      - "tests/seo*.test.ts"
      - "data/feed.json"
      - "package.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: SEO audit
        run: npm run seo-audit
